<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Морской Бой - Мультиплеер 15x15</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0a2f3a 0%, #06212a 100%);
            font-family: 'Segoe UI', 'Roboto', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .game-container {
            background: #1e3e48c9;
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 12px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            border: 1px solid #50c8e0;
        }

        .panels {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .board-panel {
            background: #0b2b2f;
            border-radius: 24px;
            padding: 8px;
            box-shadow: 0 5px 0 #04171c;
        }

        .board-title {
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #c9f0ff;
            margin-bottom: 8px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, minmax(18px, 28px));
            grid-template-rows: repeat(15, minmax(18px, 28px));
            gap: 1px;
            background-color: #1c4a55;
            padding: 5px;
            border-radius: 14px;
        }

        .cell {
            background-color: #2e6c7c;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
            color: white;
            -webkit-tap-highlight-color: transparent;
        }

        .cell.my-cell.ship-placed {
            background-color: #2f8b6e;
            position: relative;
        }
        .cell.my-cell.ship-placed::after {
            content: "⚓";
            font-size: 8px;
        }
        .cell.enemy-cell:active:not(.disabled) {
            transform: scale(0.95);
            background-color: #489eb3;
        }
        .cell.hit {
            background-color: #dc6b4a;
        }
        .cell.hit::after {
            content: "💥";
            font-size: 9px;
        }
        .cell.miss {
            background-color: #3b5f6b;
        }
        .cell.miss::after {
            content: "🌊";
            font-size: 8px;
        }
        .cell.destroyed {
            background-color: #6d2e2e;
        }
        .cell.destroyed::after {
            content: "🔥";
            font-size: 9px;
        }
        .cell.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .auth-panel, .lobby-panel, .placement-panel {
            background: #0d323cee;
            border-radius: 32px;
            padding: 20px;
            width: 95vw;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            backdrop-filter: blur(8px);
            border: 1px solid #92d9e8;
        }

        input, button {
            font-size: 0.9rem;
            padding: 10px 16px;
            margin: 6px;
            border-radius: 60px;
            border: none;
            outline: none;
            font-weight: bold;
            -webkit-appearance: none;
        }

        input {
            background: #f0f9ff;
            color: #054a56;
            width: 200px;
            text-align: center;
        }

        button {
            background: #ffc857;
            color: #1f4955;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 0 #b16220;
            touch-action: manipulation;
        }
        button:active {
            transform: translateY(2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .danger-btn {
            background: #d9675e;
            color: white;
            box-shadow: 0 3px 0 #88332b;
        }
        .success-btn {
            background: #4caf50;
            color: white;
            box-shadow: 0 3px 0 #2e7d32;
        }
        .info-text {
            background: #071e24;
            padding: 10px;
            border-radius: 40px;
            color: #bef2ff;
            margin-top: 12px;
            font-size: 0.75rem;
        }
        .fleet-status {
            font-size: 0.75rem;
            margin-top: 8px;
            padding: 6px;
            background: #00000066;
            border-radius: 20px;
        }
        .current-ship {
            font-size: 0.85rem;
            margin-top: 6px;
            padding: 6px;
            background: #ffc85733;
            border-radius: 20px;
            color: #ffd966;
            font-weight: bold;
        }
        .timer {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
            color: #ffd966;
            text-shadow: 0 0 5px #ff9900;
            margin: 8px 0;
        }
        .status-badge {
            background: #000000aa;
            padding: 8px;
            border-radius: 20px;
            margin: 5px;
            text-align: center;
            font-size: 1rem;
        }
        .opponent-status {
            font-size: 0.8rem;
            margin-top: 8px;
            color: #aaffdd;
        }
        .flex-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        form {
            margin: 0;
            padding: 0;
        }
        .waiting-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ffc857;
            animation: pulse 1s infinite;
            margin-left: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        @media (max-width: 768px) {
            .board {
                grid-template-columns: repeat(15, minmax(16px, 22px));
                grid-template-rows: repeat(15, minmax(16px, 22px));
                gap: 1px;
            }
            .cell {
                font-size: 8px;
            }
            .cell.my-cell.ship-placed::after,
            .cell.hit::after,
            .cell.miss::after,
            .cell.destroyed::after {
                font-size: 7px;
            }
            .board-title {
                font-size: 0.85rem;
            }
            button, input {
                font-size: 0.8rem;
                padding: 8px 12px;
            }
        }
        @media (max-width: 480px) {
            .board {
                grid-template-columns: repeat(15, minmax(14px, 20px));
                grid-template-rows: repeat(15, minmax(14px, 20px));
            }
            .cell {
                font-size: 7px;
            }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAKlb8rgKLj-FCBuqWWn481ojuGrAIo_C8",
    authDomain: "navalwarfare-e3e7b.firebaseapp.com",
    databaseURL: "https://navalwarfare-e3e7b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "navalwarfare-e3e7b",
    storageBucket: "navalwarfare-e3e7b.firebasestorage.app",
    messagingSenderId: "759998208305",
    appId: "1:759998208305:web:3ad036313b9e6e9ddbb810",
    measurementId: "G-1216NNDQYE"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getDatabase(firebaseApp);

  // LocalStorage keys
  const STORAGE_KEY = "naval_battle_user";
  
  let currentUser = null;
  let opponentNick = null;
  let myBoard = Array(15).fill().map(() => Array(15).fill(0));
  let enemyBoard = Array(15).fill().map(() => Array(15).fill(0));
  let gameActive = false;
  let myTurn = false;
  let gameId = null;
  let gameOver = false;
  let placementMode = false;
  let currentShipHorizontal = true;
  let timerInterval = null;
  let timeLeft = 60;
  let myReady = false;
  let gameStarted = false;
  let gameListenerRef = null;
  let inviteListenerRef = null;
  
  let fleetToPlace = [
    { length: 4, count: 1, placed: 0, name: "Линкор", size: "4-палубный" },
    { length: 3, count: 2, placed: 0, name: "Крейсер", size: "3-палубный" },
    { length: 2, count: 3, placed: 0, name: "Эсминец", size: "2-палубный" },
    { length: 1, count: 3, placed: 0, name: "Катер", size: "1-палубный" }
  ];

  // Сохранение логина/пароля
  function saveUserCredentials(nickname, password) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ nickname, password }));
  }

  function loadUserCredentials() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
          try {
              return JSON.parse(saved);
          } catch(e) { return null; }
      }
      return null;
  }

  function clearUserCredentials() {
      localStorage.removeItem(STORAGE_KEY);
  }

  function getCurrentShipInfo() {
      for (let ship of fleetToPlace) {
          if (ship.placed < ship.count) {
              return { length: ship.length, name: ship.name, size: ship.size, remaining: ship.count - ship.placed };
          }
      }
      return null;
  }

  function getCurrentShipLength() {
      const info = getCurrentShipInfo();
      return info ? info.length : 0;
  }

  function updateCurrentShipDisplay() {
      const currentShipDiv = document.getElementById('currentShipDisplay');
      if (!currentShipDiv) return;
      const info = getCurrentShipInfo();
      if (info) {
          currentShipDiv.innerHTML = `🎯 Сейчас: ${info.name} (${info.size}) осталось ${info.remaining} шт. ${currentShipHorizontal ? "➡️" : "⬇️"}`;
      } else if (allShipsPlaced()) {
          currentShipDiv.innerHTML = "✅ Все корабли готовы!";
      }
  }

  function canPlaceShip(board, row, col, length, horizontal) {
      if (horizontal) {
          if (col + length > 15) return false;
          for (let c = col; c < col + length; c++) {
              if (board[row][c] !== 0) return false;
              for (let dr = -1; dr <= 1; dr++) {
                  for (let dc = -1; dc <= 1; dc++) {
                      let nr = row + dr, nc = c + dc;
                      if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && board[nr][nc] === 1) return false;
                  }
              }
          }
      } else {
          if (row + length > 15) return false;
          for (let r = row; r < row + length; r++) {
              if (board[r][col] !== 0) return false;
              for (let dr = -1; dr <= 1; dr++) {
                  for (let dc = -1; dc <= 1; dc++) {
                      let nr = r + dr, nc = col + dc;
                      if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && board[nr][nc] === 1) return false;
                  }
              }
          }
      }
      return true;
  }

  function placeShipOnBoard(board, row, col, length, horizontal) {
      if (horizontal) {
          for (let c = col; c < col + length; c++) board[row][c] = 1;
      } else {
          for (let r = row; r < row + length; r++) board[r][col] = 1;
      }
  }

  function allShipsPlaced() {
      return fleetToPlace.every(ship => ship.placed === ship.count);
  }

  function resetFleet() {
      fleetToPlace.forEach(ship => ship.placed = 0);
      myBoard = Array(15).fill().map(() => Array(15).fill(0));
  }

  function renderPlacementBoard() {
      const container = document.getElementById('myBoardGrid');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < 15; i++) {
          for (let j = 0; j < 15; j++) {
              const cell = document.createElement('div');
              cell.className = 'cell my-cell';
              if (myBoard[i][j] === 1) cell.classList.add('ship-placed');
              cell.dataset.row = i;
              cell.dataset.col = j;
              if (placementMode && !allShipsPlaced()) {
                  cell.addEventListener('click', (e) => {
                      e.stopPropagation();
                      const row = parseInt(cell.dataset.row);
                      const col = parseInt(cell.dataset.col);
                      const length = getCurrentShipLength();
                      if (length === 0) return;
                      if (canPlaceShip(myBoard, row, col, length, currentShipHorizontal)) {
                          placeShipOnBoard(myBoard, row, col, length, currentShipHorizontal);
                          for (let ship of fleetToPlace) {
                              if (ship.placed < ship.count) {
                                  ship.placed++;
                                  break;
                              }
                          }
                          renderPlacementBoard();
                          updateFleetUI();
                          updateCurrentShipDisplay();
                          if (allShipsPlaced()) {
                              const readyBtn = document.getElementById('readyBtn');
                              if (readyBtn) readyBtn.disabled = false;
                          }
                      } else {
                          alert("❌ Нельзя поставить корабль здесь");
                      }
                  });
              }
              container.appendChild(cell);
          }
      }
  }

  function updateFleetUI() {
      const fleetDiv = document.getElementById('fleetStatus');
      if (!fleetDiv) return;
      let text = "";
      for (let ship of fleetToPlace) {
          let left = ship.count - ship.placed;
          if (left > 0) text += `${ship.name} x${left}  `;
      }
      if (allShipsPlaced()) text = "✅ Все корабли готовы!";
      else text = "📋 " + text;
      fleetDiv.innerText = text;
  }

  function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
          if (timeLeft <= 0) {
              clearInterval(timerInterval);
              if (!allShipsPlaced() || !myReady) {
                  alert("⏰ Время вышло! Игра отменена.");
                  cancelGame();
              }
          } else {
              timeLeft--;
              const timerEl = document.getElementById('timer');
              if (timerEl) timerEl.innerText = `⏱️ ${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
          }
      }, 1000);
  }

  async function cancelGame() {
      if (timerInterval) clearInterval(timerInterval);
      if (gameId) {
          await set(ref(db, `games/${gameId}`), null);
          if (opponentNick) await set(ref(db, `invites/${opponentNick}`), null);
          if (currentUser) await set(ref(db, `invites/${currentUser.nickname}`), null);
      }
      alert("Игра отменена");
      renderLobby();
  }

  async function markReady() {
      if (!allShipsPlaced()) {
          alert("Расставьте все корабли!");
          return;
      }
      
      myReady = true;
      
      const boardData = {};
      for (let i = 0; i < 15; i++) {
          boardData[`row${i}`] = myBoard[i];
      }
      
      await set(ref(db, `games/${gameId}/boards/${currentUser.nickname}`), boardData);
      await set(ref(db, `games/${gameId}/ready/${currentUser.nickname}`), true);
      
      const readyBtn = document.getElementById('readyBtn');
      if (readyBtn) {
          readyBtn.disabled = true;
          readyBtn.innerHTML = "✅ ГОТОВО ⏳";
      }
      
      const readyRef = ref(db, `games/${gameId}/ready`);
      const unsubscribe = onValue(readyRef, (snapshot) => {
          const data = snapshot.val();
          if (data && data[currentUser.nickname] && data[opponentNick] && !gameStarted) {
              unsubscribe();
              gameStarted = true;
              if (timerInterval) clearInterval(timerInterval);
              alert("🎉 Оба игрока готовы! Игра начинается!");
              startBattle();
          }
      });
  }

  async function startBattle() {
      gameActive = true;
      placementMode = false;
      myTurn = (Math.random() < 0.5);
      
      await set(ref(db, `games/${gameId}/turn`), myTurn ? currentUser.nickname : opponentNick);
      await set(ref(db, `games/${gameId}/status`), "active");
      
      renderGameBoard();
      listenToGameEvents();
  }

  function renderGameBoard() {
      const appDiv = document.getElementById('app');
      appDiv.innerHTML = `
          <div class="game-container">
              <div class="panels">
                  <div class="board-panel">
                      <div class="board-title">⚓ МОЯ ФЛОТИЛИЯ</div>
                      <div id="myGameBoard" class="board"></div>
                  </div>
                  <div class="board-panel">
                      <div class="board-title">🎯 АТАКА: ${opponentNick}</div>
                      <div id="enemyBoardGrid" class="board"></div>
                  </div>
              </div>
              <div class="status-badge" id="turnStatus"></div>
              <button id="exitGameBtn" class="danger-btn">🏠 Выйти</button>
          </div>
      `;
      renderMyGameBoard();
      renderEnemyBoard();
      updateTurnDisplay();
      
      document.getElementById('exitGameBtn').onclick = () => {
          if (confirm("Выйти из игры?")) {
              location.reload();
          }
      };
  }

  function renderMyGameBoard() {
      const container = document.getElementById('myGameBoard');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < 15; i++) {
          for (let j = 0; j < 15; j++) {
              const cell = document.createElement('div');
              cell.className = 'cell my-cell disabled';
              if (myBoard[i][j] === 1) cell.classList.add('ship-placed');
              if (myBoard[i][j] === 2 || myBoard[i][j] === 3) cell.classList.add('hit');
              container.appendChild(cell);
          }
      }
  }

  function renderEnemyBoard() {
      const container = document.getElementById('enemyBoardGrid');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < 15; i++) {
          for (let j = 0; j < 15; j++) {
              const cell = document.createElement('div');
              cell.className = 'cell enemy-cell';
              if (enemyBoard[i][j] === 1) cell.classList.add('miss');
              if (enemyBoard[i][j] === 2) cell.classList.add('hit');
              if (enemyBoard[i][j] === 3) cell.classList.add('destroyed');
              if (gameActive && myTurn && !gameOver && enemyBoard[i][j] === 0) {
                  cell.addEventListener('click', () => makeAttack(i, j));
              } else if (!myTurn || gameOver) {
                  cell.classList.add('disabled');
              }
              container.appendChild(cell);
          }
      }
  }

  async function makeAttack(row, col) {
      if (!myTurn || gameOver) return;
      if (enemyBoard[row][col] !== 0) return;
      
      const opponentBoardRef = ref(db, `games/${gameId}/boards/${opponentNick}`);
      const snapshot = await get(opponentBoardRef);
      
      if (snapshot.exists()) {
          const boardData = snapshot.val();
          const cellValue = boardData[`row${row}`][col];
          
          if (cellValue === 1) {
              enemyBoard[row][col] = 2;
              const updatedRow = [...boardData[`row${row}`]];
              updatedRow[col] = 2;
              await update(ref(db, `games/${gameId}/boards/${opponentNick}`), { [`row${row}`]: updatedRow });
              
              const win = await checkWinCondition();
              if (win) {
                  gameOver = true;
                  await set(ref(db, `games/${gameId}/winner`), currentUser.nickname);
                  alert(`🏆 ПОБЕДА! ${currentUser.nickname} уничтожил все корабли!`);
                  renderEnemyBoard();
                  updateTurnDisplay();
                  return;
              }
              
              myTurn = false;
              await set(ref(db, `games/${gameId}/turn`), opponentNick);
          } else if (cellValue === 0) {
              enemyBoard[row][col] = 1;
              myTurn = false;
              await set(ref(db, `games/${gameId}/turn`), opponentNick);
          }
          
          renderEnemyBoard();
          updateTurnDisplay();
      }
  }

  async function checkWinCondition() {
      const opponentBoardRef = ref(db, `games/${gameId}/boards/${opponentNick}`);
      const snapshot = await get(opponentBoardRef);
      if (snapshot.exists()) {
          const boardData = snapshot.val();
          for (let i = 0; i < 15; i++) {
              for (let j = 0; j < 15; j++) {
                  if (boardData[`row${i}`][j] === 1) return false;
              }
          }
          return true;
      }
      return false;
  }

  function updateTurnDisplay() {
      const turnDiv = document.getElementById('turnStatus');
      if (turnDiv) {
          if (gameOver) {
              turnDiv.innerText = "🏁 ИГРА ОКОНЧЕНА 🏁";
          } else {
              turnDiv.innerText = myTurn ? "🔥 ВАШ ХОД! 🔥" : "⏳ ХОД ПРОТИВНИКА...";
              turnDiv.style.color = myTurn ? "#ffcc00" : "#88ccff";
          }
      }
  }

  function listenToGameEvents() {
      if (gameListenerRef) gameListenerRef();
      
      const turnRef = ref(db, `games/${gameId}/turn`);
      gameListenerRef = onValue(turnRef, (snapshot) => {
          if (snapshot.exists() && gameActive && !gameOver) {
              const turnOwner = snapshot.val();
              myTurn = (turnOwner === currentUser.nickname);
              updateTurnDisplay();
              renderEnemyBoard();
          }
      });
      
      const myBoardRef = ref(db, `games/${gameId}/boards/${currentUser.nickname}`);
      onValue(myBoardRef, (snapshot) => {
          if (snapshot.exists() && gameActive) {
              const boardData = snapshot.val();
              for (let i = 0; i < 15; i++) {
                  for (let j = 0; j < 15; j++) {
                      if (boardData[`row${i}`][j] === 2 || boardData[`row${i}`][j] === 3) {
                          if (myBoard[i][j] !== boardData[`row${i}`][j]) {
                              myBoard[i][j] = boardData[`row${i}`][j];
                              renderMyGameBoard();
                          }
                      }
                  }
              }
          }
      });
      
      const winnerRef = ref(db, `games/${gameId}/winner`);
      onValue(winnerRef, (snapshot) => {
          if (snapshot.exists() && !gameOver) {
              gameOver = true;
              alert(`🏆 ИГРА ОКОНЧЕНА! Победитель: ${snapshot.val()}`);
              updateTurnDisplay();
          }
      });
  }

  async function createGame(invitedNick) {
      gameId = `game_${currentUser.nickname}_${invitedNick}_${Date.now()}`;
      opponentNick = invitedNick;
      
      await set(ref(db, `games/${gameId}`), {
          player1: currentUser.nickname,
          player2: invitedNick,
          status: "placement",
          turn: null,
          ready: { [currentUser.nickname]: false, [invitedNick]: false },
          createdAt: Date.now()
      });
      
      await set(ref(db, `invites/${invitedNick}`), {
          from: currentUser.nickname,
          gameId: gameId,
          timestamp: Date.now()
      });
      
      startPlacementPhase();
  }

  async function acceptInvite(fromNick, inviteGameId) {
      gameId = inviteGameId;
      opponentNick = fromNick;
      await set(ref(db, `invites/${currentUser.nickname}`), null);
      startPlacementPhase();
  }

  function startPlacementPhase() {
      resetFleet();
      myReady = false;
      gameStarted = false;
      placementMode = true;
      currentShipHorizontal = true;
      timeLeft = 60;
      
      renderPlacementScreen();
      startTimer();
  }

  function renderPlacementScreen() {
      const appDiv = document.getElementById('app');
      appDiv.innerHTML = `
          <div class="placement-panel">
              <h2>⚓ РАССТАНОВКА</h2>
              <div class="timer" id="timer">⏱️ 1:00</div>
              <div class="opponent-status">🎮 Противник: ${opponentNick}</div>
              <div class="fleet-status" id="fleetStatus"></div>
              <div class="current-ship" id="currentShipDisplay"></div>
              <div class="board" id="myBoardGrid"></div>
              <div class="flex-buttons">
                  <button id="rotateBtn" class="rotate-btn">🔄 Повернуть</button>
                  <button id="readyBtn" class="success-btn" disabled>✅ ГОТОВО</button>
                  <button id="cancelGameBtn" class="danger-btn">❌ Отмена</button>
              </div>
              <div class="info-text">
                  💡 Нажми на клетку, чтобы поставить корабль. Корабли не должны касаться!
              </div>
          </div>
      `;
      renderPlacementBoard();
      updateFleetUI();
      updateCurrentShipDisplay();
      
      document.getElementById('rotateBtn').onclick = () => {
          currentShipHorizontal = !currentShipHorizontal;
          updateCurrentShipDisplay();
      };
      document.getElementById('readyBtn').onclick = () => markReady();
      document.getElementById('cancelGameBtn').onclick = () => cancelGame();
  }

  async function autoLogin() {
      const saved = loadUserCredentials();
      if (saved && saved.nickname && saved.password) {
          const userRef = ref(db, `users/${saved.nickname}`);
          const snapshot = await get(userRef);
          if (snapshot.exists() && snapshot.val().password === saved.password) {
              currentUser = { nickname: saved.nickname, password: saved.password };
              renderLobby();
              return true;
          } else {
              clearUserCredentials();
          }
      }
      return false;
  }

  function renderAuth() {
      const appDiv = document.getElementById('app');
      appDiv.innerHTML = `
          <div class="auth-panel">
              <h2>⚓ МОРСКОЙ БОЙ ⚓</h2>
              <form id="loginForm" onsubmit="return false;">
                  <div><input type="text" id="loginNick" placeholder="Никнейм" maxlength="20" autocomplete="username"></div>
                  <div><input type="password" id="loginPass" placeholder="Пароль" autocomplete="current-password"></div>
                  <button type="button" id="loginBtn">🔐 Войти / Регистрация</button>
              </form>
              <div id="authStatus" class="info-text">Введите логин и пароль (мин 3 символа)</div>
          </div>
      `;
      
      // Автозаполнение из localStorage
      const saved = loadUserCredentials();
      if (saved) {
          document.getElementById('loginNick').value = saved.nickname || '';
          document.getElementById('loginPass').value = saved.password || '';
      }
      
      document.getElementById('loginBtn').onclick = async () => {
          const nick = document.getElementById('loginNick').value.trim();
          const pwd = document.getElementById('loginPass').value.trim();
          if (nick.length < 3 || pwd.length < 2) {
              document.getElementById('authStatus').innerText = "❌ Ник (мин 3) и пароль (мин 2)";
              return;
          }
          const userRef = ref(db, `users/${nick}`);
          const snapshot = await get(userRef);
          if (snapshot.exists()) {
              if (snapshot.val().password === pwd) {
                  currentUser = { nickname: nick, password: pwd };
                  saveUserCredentials(nick, pwd);
                  renderLobby();
              } else {
                  document.getElementById('authStatus').innerText = "❌ Неверный пароль";
              }
          } else {
              await set(userRef, { password: pwd, createdAt: Date.now() });
              currentUser = { nickname: nick, password: pwd };
              saveUserCredentials(nick, pwd);
              renderLobby();
          }
      };
  }

  function renderLobby() {
      const appDiv = document.getElementById('app');
      appDiv.innerHTML = `
          <div class="lobby-panel">
              <h2>🏴‍☠️ Игровой порт</h2>
              <div>👤 ${currentUser.nickname}</div>
              <div><input type="text" id="inviteNick" placeholder="Ник противника" maxlength="20"></div>
              <button id="inviteBtn">📨 Пригласить</button>
              <button id="logoutBtn" class="danger-btn">🚪 Выйти</button>
              <div id="lobbyStatus" class="info-text">Введите ник и нажмите "Пригласить"</div>
          </div>
      `;
      document.getElementById('inviteBtn').onclick = () => {
          const target = document.getElementById('inviteNick').value.trim();
          if (!target || target === currentUser.nickname) {
              alert("Укажите корректный ник");
              return;
          }
          createGame(target);
      };
      document.getElementById('logoutBtn').onclick = () => {
          if (inviteListenerRef) inviteListenerRef();
          if (gameListenerRef) gameListenerRef();
          clearUserCredentials();
          currentUser = null;
          renderAuth();
      };
      listenForInvites();
  }

  function listenForInvites() {
      if (inviteListenerRef) inviteListenerRef();
      const invitesRef = ref(db, `invites/${currentUser.nickname}`);
      inviteListenerRef = onValue(invitesRef, (snapshot) => {
          const data = snapshot.val();
          if (data && data.from && data.gameId && !gameActive && !placementMode && !gameStarted) {
              const accept = confirm(`⚔️ ${data.from} приглашает вас на дуэль! Принять?`);
              if (accept) {
                  acceptInvite(data.from, data.gameId);
              } else {
                  set(ref(db, `invites/${currentUser.nickname}`), null);
              }
          }
      });
  }

  // Запуск с авто-логином
  (async () => {
      const autoLogged = await autoLogin();
      if (!autoLogged) {
          renderAuth();
      }
  })();
</script>
</body>
</html>
